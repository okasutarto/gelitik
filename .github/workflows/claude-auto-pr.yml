name: Claude Auto PR

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-pr:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@claude')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 15 --dangerouslyAllowAnthropicKey"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR if needed
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "master" ]; then
            PR_EXISTS=$(gh pr list --head "$BRANCH" --json number -q 'length(@)')
            if [ "$PR_EXISTS" = "0" ]; then
              gh pr create --title "Auto PR: $BRANCH" --body "Created by Claude Code automation" --base main
              echo "PR created for branch: $BRANCH"
            else
              echo "PR already exists for branch: $BRANCH"
            fi
          fi

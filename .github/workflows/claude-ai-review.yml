name: AI Code Review (MiniMax)

on:
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          # Ambil PR number dari event
          PR_NUM=${{ github.event.pull_request.number }}

          # Generate diff dalam format yang bisa dibaca AI
          # Kita ambil semua file yang berubah (modified, added, deleted)
          git diff --name-status HEAD~1..HEAD > pr_diff.txt

          # Tambahkan konteks file yang diubah
          echo "\n--- File Changed ---\n" >> pr_diff.txt
          git diff --no-prefix HEAD~1..HEAD >> pr_diff.txt

      - name: Get Review from MiniMax
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
        run: |
          # Skip if API key is not configured
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo '{"choices":[{"message":{"content":"## AI Code Review\n\nMiniMax API key not configured. Skipping AI review."}}]}' > minimax_response.json
            exit 0
          fi

          # Skip if GroupId is not configured
          if [ -z "$MINIMAX_GROUP_ID" ]; then
            echo '{"choices":[{"message":{"content":"## AI Code Review\n\nMiniMax GroupId not configured. Skipping AI review."}}]}' > minimax_response.json
            exit 0
          fi

          # Membaca diff dan siapkan payload JSON
          DIFF_CONTENT=$(cat pr_diff.txt | jq -sR .)

          # MiniMax v2.5 API dengan GroupId
          curl -s --location "https://api.minimax.chat/v1/text/chatcompletion_v2.5?GroupId=$MINIMAX_GROUP_ID" \
          --header "Content-Type: application/json" \
          --header "Authorization: Bearer $MINIMAX_API_KEY" \
          --data "{
            \"model\": \"abab6.5s-chat\",
            \"messages\": [
              {
                \"role\": \"system\",
                \"content\": \"Kamu adalah Senior Architect & Code Reviewer. Berikan review untuk perubahan kode berikut. Fokus pada modularitas Vue 3 dan potensi bug.\"
              },
              {
                \"role\": \"user\",
                \"content\": $DIFF_CONTENT
              }
            ]
          }" > minimax_response.json

      - name: Format & Post Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Debug: Show raw response
          echo "=== RAW RESPONSE ===" && cat minimax_response.json && echo "=== END ==="

          # Check if valid JSON first
          if ! jq empty minimax_response.json 2>/dev/null; then
            echo "## AI Code Review\n\n⚠️ Invalid API response. Check API configuration." > review_output.md
          elif grep -q "404\|error\|not found\|invalid" minimax_response.json; then
            echo "## AI Code Review\n\n⚠️ MiniMax API not available. Please configure API key." > review_output.md
          else
            # Try to extract review from various response formats
            set +e
            REVIEW=$(cat minimax_response.json | jq -r '.choices[0].message.content' 2>/dev/null)
            if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
              REVIEW=$(cat minimax_response.json | jq -r '.choices[0].text' 2>/dev/null)
            fi
            if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
              REVIEW=$(cat minimax_response.json | jq -r '.output_text' 2>/dev/null)
            fi
            set -e

            if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
              REVIEW="## AI Code Review\n\nUnable to parse review response."
            fi
            echo -e "$REVIEW" > review_output.md
          fi

          gh pr comment ${{ github.event.pull_request.number }} --body-file review_output.md

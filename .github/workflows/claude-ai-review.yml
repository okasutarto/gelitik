name: AI Code Review (MiniMax)

on:
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          # Ambil PR number dari event
          PR_NUM=${{ github.event.pull_request.number }}

          # Generate diff dalam format yang bisa dibaca AI
          # Kita ambil semua file yang berubah (modified, added, deleted)
          git diff --name-status HEAD~1..HEAD > pr_diff.txt

          # Tambahkan konteks file yang diubah
          echo "\n--- File Changed ---\n" >> pr_diff.txt
          git diff --no-prefix HEAD~1..HEAD >> pr_diff.txt

      - name: Get Review from MiniMax
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          # Skip if API key is not configured
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo '{"choices":[{"message":{"content":"## AI Code Review\n\nMiniMax API key not configured. Skipping AI review."}}]}' > minimax_response.json
            exit 0
          fi

          # Get diff content - limit to first 5000 chars to avoid too large
          DIFF_CONTENT=$(head -c 5000 pr_diff.txt)

          # Build JSON payload - escape content properly
          printf '{"model": "M2-her", "messages": [{"role": "system", "content": "Kamu adalah Senior Architect & Code Reviewer. Berikan review untuk perubahan kode berikut. Fokus pada modularitas Vue 3 dan potensi bug."}, {"role": "user", "content": "%s"}]}' "$DIFF_CONTENT" > request_body.json

          # MiniMax API - correct endpoint
          curl -s --location "https://api.minimax.io/v1/text/chatcompletion_v2" \
          --header "Content-Type: application/json" \
          --header "Authorization: Bearer $MINIMAX_API_KEY" \
          --data @request_body.json -o minimax_response.json

          # Check if response is valid
          if [ ! -s minimax_response.json ]; then
            echo '{"choices":[{"message":{"content":"## AI Code Review\n\nEmpty response from API"}}]}' > minimax_response.json
          fi

      - name: Format & Post Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Try to extract review
          set +e
          REVIEW=$(cat minimax_response.json | jq -r '.choices[0].message.content' 2>/dev/null)
          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            REVIEW=$(cat minimax_response.json | jq -r '.choices[0].text' 2>/dev/null)
          fi
          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            # Check for errors
            ERROR=$(cat minimax_response.json | jq -r '.base_resp.status_msg // .error.message // empty' 2>/dev/null)
            if [ -n "$ERROR" ]; then
              REVIEW="## AI Code Review\n\n⚠️ API Error: $ERROR"
            else
              REVIEW="## AI Code Review\n\nUnable to parse response. Raw: $(cat minimax_response.json | head -c 300)"
            fi
          fi
          set -e

          echo -e "$REVIEW" > review_output.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file review_output.md
